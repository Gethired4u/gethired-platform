name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GETHIRED4U_EC2_HOST }}
          username: ${{ secrets.GETHIRED4U_EC2_USER }}
          key: ${{ secrets.GETHIRED4U_EC2_SSH_KEY }}
          script: |
            set -e   # stop immediately if any command fails

            PROJECT_DIR=~/gethired-platform

            echo "=== Pulling latest code ==="
            cd $PROJECT_DIR
            git pull origin main

            echo "=== Updating backend dependencies ==="
            cd $PROJECT_DIR/backend
            ./venv/bin/pip install -r requirements.txt --quiet

            echo "=== Building frontend ==="
            cd $PROJECT_DIR/frontend
            npm ci --prefer-offline --silent
            npm run build

            echo "=== Deploying frontend to Nginx root ==="
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            echo "=== Restarting backend service ==="
            sudo systemctl restart gethired-backend

            echo "=== Reloading Nginx ==="
            sudo systemctl reload nginx

            echo ""
            echo "Deployment complete ✅"
            echo "Backend: $(sudo systemctl is-active gethired-backend)"
            echo "Nginx:   $(sudo systemctl is-active nginx)"
