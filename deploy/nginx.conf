server {
    listen 80;
    server_name gethired4u.com www.gethired4u.com _;

    root /var/www/html;
    index index.html;

    # ── Increase upload limit for resume files ────────────────────────────
    client_max_body_size 15M;

    # ── Backend API routes ────────────────────────────────────────────────
    # Any URL starting with these paths goes to the FastAPI backend
    location ~ ^/(analyze-resume|register|admin|users|upload-resume|payment|settings|health|uploads|analysis-history) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Static assets (cache aggressively) ───────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend SPA fallback ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
