server {
    listen 80;
    server_name gethired4u.com www.gethired4u.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gethired4u.com www.gethired4u.com;

    ssl_certificate     /etc/letsencrypt/live/gethired4u.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gethired4u.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html;
    client_max_body_size 15M;

    # ── All API calls go through /api/ prefix ─────────────────────────────
    # /api/admin/login  → backend /admin/login
    # /api/register-lead → backend /register-lead
    # /api/analyze-resume → backend /analyze-resume
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    # Compatibility for older/static frontend builds that called backend routes
    # without the /api prefix.
    location ~ ^/(analyze-resume|register|upload-resume|payment/|settings/offer|admin/|users|analysis-history) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── React SPA — all other routes ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
